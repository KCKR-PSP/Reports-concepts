<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Planowanie operacyjne · Koncepcje Reports</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
.app{position:relative;min-height:100vh;color:#1c2427;font-family:'Instrument Sans',ui-sans-serif,system-ui,sans-serif;background:linear-gradient(160deg,hsl(200 11% 92%),hsl(202 10% 81%));overflow:hidden}
.shade{position:absolute;inset:0;pointer-events:none;background:radial-gradient(48% 55% at 92% 8%,hsl(202 12% 62%/.9),transparent 72%),radial-gradient(65% 55% at 74% 100%,hsl(202 12% 62%/.9),transparent 72%),radial-gradient(40% 45% at 4% 62%,hsl(202 12% 68%/.75),transparent 72%)}
.mist{position:absolute;inset:0;pointer-events:none;background:radial-gradient(78% 66% at 14% 12%,#fff,transparent 72%),radial-gradient(58% 58% at 28% 92%,#fff,transparent 70%),radial-gradient(62% 52% at 62% 48%,rgb(255 255 255/.8),transparent 70%),radial-gradient(46% 42% at 96% 70%,rgb(255 255 255/.8),transparent 70%)}
.pill{position:absolute;z-index:2;left:16px;top:450px;transform:translateY(-50%);display:flex;flex-direction:column;gap:4px;padding:8px;border-radius:9999px;background:rgb(255 255 255/.32);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border:1px solid rgb(255 255 255/.75);box-shadow:inset 0 1px 0 rgb(255 255 255/.5),0 18px 40px -22px hsl(200 35% 12%/.45)}
.pi{width:44px;height:44px;border-radius:9999px;display:flex;align-items:center;justify-content:center;color:hsl(200 12% 24%);font:700 15px 'Instrument Sans',sans-serif}
.main{position:relative;z-index:1;padding-left:94px}
.crumb{display:inline-flex;align-items:center;gap:12px;font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}
.optabs{display:flex;gap:32px}
.optab{font-size:15px;font-weight:500;text-transform:uppercase;padding-bottom:8px;border-bottom:2px solid transparent}
.optab.on{border-bottom-color:#1c2427}
.rgrp{margin:0 0 14px;font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;border-bottom:1px solid #1c2427;padding-bottom:12px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.rtile{position:relative;isolation:isolate;aspect-ratio:5/4;background:#fff;padding:24px;display:flex;flex-direction:column;justify-content:space-between;color:#1c2427;transition:background .15s,color .15s;overflow:hidden}
.rtile:hover{background:#1c2427;color:#fff}
.rtile .top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.rtile .arr{margin-left:auto;flex:none}
.rtile .ttl{font-size:26px;font-weight:500;letter-spacing:-.015em;line-height:1.15}
.rtile.att::before{content:'';position:absolute;inset:0;z-index:-1;background:hsl(0 72% 51%/.16);animation:breathe 3.6s ease-in-out 600ms infinite}
.cnt{min-width:28px;padding:0 6px;box-sizing:border-box;text-align:center;font-size:14px;line-height:28px;font-weight:600;font-variant-numeric:tabular-nums;background:#b3261e;color:#fff}
@keyframes breathe{50%{opacity:.55}}
@media (prefers-reduced-motion: reduce){.rtile.att::before{animation:none}}
@media (max-width: 900px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.main{padding-left:0}.pill{display:none}}
</style>

<style>
html,body{margin:0;background:#ebeef0}
body.dark{background:#121518}
.cbar{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;padding:8px clamp(16px, 4vw, 40px);
  background:#1c2427;color:#ebeef0;font:500 13px/1.3 'Instrument Sans',ui-sans-serif,system-ui,sans-serif}
.cbar a{color:inherit;text-decoration:none;display:inline-flex;align-items:center;min-height:36px}
.cbar a:hover{text-decoration:underline}
.cbar .ttl{font-weight:700}
.cbar .tag{padding:3px 8px;border:1px solid #535f65;color:#a9b3b8;font-size:12px}
.cbar .sp{flex:1}
.cbar nav{display:flex;flex-wrap:wrap;gap:4px 16px}
.cbar nav a[aria-current="page"]{font-weight:700;text-decoration:underline}
.cbar label{display:inline-flex;align-items:center;gap:8px;color:#a9b3b8}
.cbar select{min-height:32px;padding:0 8px;border:1px solid #535f65;border-radius:0;background:#1c2427;color:#ebeef0;font:inherit}
.cbar a:focus-visible,.cbar select:focus-visible{outline:2px solid #ebeef0;outline-offset:2px}
@media (max-width: 760px){.cbar{position:static}}
body.framed #board{display:flex;justify-content:center;padding:32px 16px 64px;overflow-x:auto}
body.framed #board > *{flex:none;box-shadow:0 1px 2px rgba(28,36,39,.12),0 8px 32px rgba(28,36,39,.10)}
</style>
</head>
<body>
<div class="cbar">
<a href="../index.html">← Koncepcje Reports</a>
<span class="ttl">Karta jednostki OSP i wnioski KSRG</span>
<span class="tag">Koncepcja · dane przykładowe</span>
<nav aria-label="Plansze"><a href="index.html" aria-current="page">Planowanie operacyjne</a><a href="jednostki.html">Jednostki w powiecie</a><a href="wnioski-ksrg.html">Wnioski KSRG</a><a href="karta.html">Karta jednostki</a><a href="wnioski.html">Wniosek</a></nav>
<span class="sp"></span>
<label>Widok<select data-prop="rola"><option selected>KP PSP</option><option>KW PSP</option><option>KG PSP</option></select></label>
</div>
<div id="board"></div>
<template id="board-template">
<div class="app">
<div class="shade" aria-hidden="true"></div><div class="mist" aria-hidden="true"></div>
<nav class="pill" aria-label="Nawigacja główna">
<span class="pi" style="font-size:20px;font-weight:800">R</span>
<span class="pi"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg></span>
<span class="pi"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg></span>
<span class="pi"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg></span>
<span class="pi"><span style="width:32px;height:32px;border-radius:8px;background:#d3dadd;color:#1c2427;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600">AN</span></span>
</nav>
<div class="main">
<div style="padding:40px clamp(16px, 5vw, 80px) 0">
<span class="crumb"><svg width="32" height="12" viewBox="0 0 32 12" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M32 6H2M7 1 2 6l5 5"></path></svg>Panel użytkownika</span>
<h1 style="margin:96px 0 0;font-size:clamp(56px, 9vw, 130px);line-height:.92;font-weight:600;letter-spacing:-.035em">Planowanie operacyjne</h1>
<nav class="optabs" style="margin-top:36px" aria-label="Widok zasobu"><span class="optab on">Zasób</span><span class="optab">Udostępnione</span></nav>
</div>
<div style="max-width:84rem;padding:56px clamp(16px, 5vw, 80px) 80px;display:flex;flex-direction:column;gap:64px">
<template data-sc="for" list="{{ sections }}" as="g" hint-placeholder-count="3">
<section aria-label="{{ g.label }}">
<h2 class="rgrp">{{ g.label }}</h2>
<div class="tiles">
<template data-sc="for" list="{{ g.items }}" as="t" hint-placeholder-count="2">
<a class="rtile {{ t.cls }}" href="{{ t.href }}" aria-label="{{ t.aria }}">
<span class="top"><template data-sc="if" value="{{ t.count }}" hint-placeholder-val="{{ false }}"><span class="cnt" aria-hidden="true">{{ t.count }}</span></template><svg class="arr" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.25" aria-hidden="true"><path d="M1.5 16.5L16.5 1.5M5.5 1.5h11v11"></path></svg></span>
<span class="ttl">{{ t.label }}</span>
</a>
</template>
</div>
</section>
</template>
</div>
</div>
</div>
</template>
<script src="../assets/dc-runtime.js?v=0410c0de7c"></script>
<script>

// Strona zasobu „Planowanie operacyjne” jak w Reports. Nowa część „Wnioski KSRG” (kolejka wniosków w obszarze konta).
// Kafel z licznikiem przechodzi do sekcji „Wymaga reakcji” (mechanizm ModuleAttention):
// KP – wniosek zwrócony do poprawy i OSP, którym włączenie kończy się w ciągu 6 miesięcy bez rozpoczętego wniosku;
// KW – wnioski przekazane przez KP; KG – wnioski KW czekające na decyzję.
const ATTENTION = { 'KP PSP': 3, 'KW PSP': 2, 'KG PSP': 3 };
const noun = (n) => (n === 1 ? 'sprawa czeka na reakcję' : n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 12 || n % 100 > 14) ? 'sprawy czekają na reakcję' : 'spraw czeka na reakcję');

class Component extends DCLogic {
  renderVals() {
    const role = this.props.rola ?? 'KP PSP';
    const parts = [
      { group: 'Jednostki', key: 'fire_units', label: 'Jednostki ochrony przeciwpożarowej', href: 'jednostki.html', count: 0 },
      { group: 'Jednostki', key: 'ksrg_applications', label: 'Wnioski KSRG', href: 'wnioski-ksrg.html', count: ATTENTION[role] || 0 },
      { group: 'Dokumenty', key: 'forms', label: 'Formularze', href: 'index.html', count: 0 }
    ].map((p) => Object.assign(p, { cls: p.count ? 'att' : '', aria: p.count ? p.label + ': ' + p.count + ' ' + noun(p.count) : p.label }));
    const urgent = parts.filter((p) => p.count);
    const rest = ['Jednostki', 'Dokumenty'].map((label) => ({ label, items: parts.filter((p) => p.group === label && !p.count) })).filter((g) => g.items.length);
    return { sections: (urgent.length ? [{ label: 'Wymaga reakcji', items: urgent }] : []).concat(rest) };
  }
}

(function () {
  const props = {"rola": "KP PSP"};
  const applyTheme = () => document.body.classList.toggle('dark', props.theme === 'ciemny');
  const board = mountBoard(document.getElementById('board'), document.getElementById('board-template'), Component, props);
  applyTheme();
  document.querySelectorAll('.cbar select[data-prop]').forEach((select) => select.addEventListener('change', () => {
    props[select.dataset.prop] = select.value;
    board.setProps({ [select.dataset.prop]: select.value });
    applyTheme();
  }));
})();
</script>
</body>
</html>
