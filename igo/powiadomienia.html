<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Powiadomienia · Koncepcje Reports</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&amp;family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,200,0,0&amp;display=block">
<style>
body{margin:0}
.ms{font-family:"Material Symbols Outlined";font-weight:200;font-style:normal;font-size:24px;line-height:1;letter-spacing:normal;text-transform:none;white-space:nowrap;-webkit-font-smoothing:antialiased;font-feature-settings:"liga"}
.it{display:grid;grid-template-columns:28px minmax(0,1fr);gap:14px;padding:16px 4px;border-top:1px solid #d3dadd;text-decoration:none;color:#1c2427}
.it:hover{background:#e1e6e9}
.lnk{background:none;border:0;padding:6px 0;font:inherit;font-size:13px;color:#535f65;cursor:pointer;text-underline-offset:6px}
.lnk[aria-pressed="true"]{color:#1c2427;text-decoration:underline;text-decoration-thickness:2px}
</style>

<style>
html,body{margin:0;background:#ebeef0}
body.dark{background:#121518}
.cbar{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;padding:8px clamp(16px, 4vw, 40px);
  background:#1c2427;color:#ebeef0;font:500 13px/1.3 'Instrument Sans',ui-sans-serif,system-ui,sans-serif}
.cbar a{color:inherit;text-decoration:none;display:inline-flex;align-items:center;min-height:36px}
.cbar a:hover{text-decoration:underline}
.cbar .ttl{font-weight:700}
.cbar .tag{padding:3px 8px;border:1px solid #535f65;color:#a9b3b8;font-size:12px}
.cbar .sp{flex:1}
.cbar nav{display:flex;flex-wrap:wrap;gap:4px 16px}
.cbar nav a[aria-current="page"]{font-weight:700;text-decoration:underline}
.cbar label{display:inline-flex;align-items:center;gap:8px;color:#a9b3b8}
.cbar select{min-height:32px;padding:0 8px;border:1px solid #535f65;border-radius:0;background:#1c2427;color:#ebeef0;font:inherit}
.cbar a:focus-visible,.cbar select:focus-visible{outline:2px solid #ebeef0;outline-offset:2px}
@media (max-width: 760px){.cbar{position:static}}
body.framed #board{display:flex;justify-content:center;padding:32px 16px 64px;overflow-x:auto}
body.framed #board > *{flex:none;box-shadow:0 1px 2px rgba(28,36,39,.12),0 8px 32px rgba(28,36,39,.10)}
</style>
</head>
<body class="framed">
<div class="cbar">
<a href="../index.html">← Koncepcje Reports</a>
<span class="ttl">Inspekcje gotowości operacyjnej</span>
<span class="tag">Koncepcja · dane przykładowe</span>
<nav aria-label="Plansze"><a href="index.html">Pulpit</a><a href="zestawienie.html">Zestawienie</a><a href="plan.html">Plan i sprawozdanie</a><a href="dokumenty.html">Szkice i dokumenty</a><a href="kreator.html">Kreator JRG</a><a href="reguly.html">Reguły oceny</a><a href="baza-pytan.html">Baza pytań</a><a href="test-telefon.html">Test na telefonie</a><a href="powiadomienia.html" aria-current="page">Powiadomienia</a><a href="protokol.html">Protokół · str. 1</a><a href="protokol-ocena.html">Protokół · ocena</a><a href="upowaznienie.html">Upoważnienie</a><a href="wystapienie.html">Wystąpienie poinspekcyjne</a><a href="podmiot.html">Widok podmiotu</a></nav>
<span class="sp"></span>

</div>
<div id="board"></div>
<template id="board-template">
<div style="width: 440px; height: 820px; box-sizing: border-box; padding: 24px 24px 20px; background: #ebeef0; color: #1c2427; font-family: 'Instrument Sans', system-ui, sans-serif; display: flex; flex-direction: column; gap: 14px; border: 1px solid #b4bec3;">
<div style="display: flex; justify-content: space-between; align-items: baseline;">
<h1 style="margin: 0; font-size: 22px; font-weight: 600;">Powiadomienia</h1>
<span style="font-size: 13px; color: #535f65;">{{ unread }} nowe</span>
</div>
<div role="group" aria-label="Filtr" style="display: flex; gap: 18px; border-bottom: 1px solid #d3dadd; margin-bottom: -15px;">
<template data-sc="for" list="{{ tabs }}" as="t"><button type="button" class="lnk" aria-pressed="{{ t.on }}" onClick="{{ t.pick }}">{{ t.label }}</button></template>
</div>
<div style="display: flex; flex-direction: column;">
<template data-sc="for" list="{{ items }}" as="n" hint-placeholder-count="6">
<a class="it" href="{{ n.href }}" style="{{ n.bg }}">
<span class="ms" aria-hidden="true" style="{{ n.iconStyle }}">{{ n.icon }}</span>
<span style="display: flex; flex-direction: column; gap: 4px; min-width: 0;">
<span style="display: flex; justify-content: space-between; gap: 10px;"><span style="font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; {{ n.whenStyle }}">{{ n.when }}</span><span style="font-size: 12px; color: #535f65;">{{ n.ago }}</span></span>
<span style="font-size: 15px; font-weight: 600; line-height: 1.3;">{{ n.title }}</span>
<span style="font-size: 13px; color: #535f65;">{{ n.sub }}</span>
</span>
</a>
</template>
</div>
</div>
</template>
<script src="../assets/dc-runtime.js"></script>
<script>

class Component extends DCLogic {
  constructor(props) { super(props); this.state = { tab: 'igo' }; }
  renderVals() {
    const warn = 'color: #b3261e;';
    const all = [
      { icon: 'assignment_late', when: 'po terminie · 07.11', title: 'Protokół z IGO nie trafił do zarządzającego', sub: 'JRG 2 Puławy, zm. II · 4 dni robocze od 06.11', ago: '2 dni', href: 'kreator.html', urgent: true, isNew: true },
      { icon: 'send', when: 'dziś', title: 'Termin wystąpienia poinspekcyjnego', sub: 'OSP Końskowola · do wójta gminy · 14 dni od protokołu', ago: '08:00', href: 'wystapienie.html', urgent: true, isNew: true },
      { icon: 'block', when: 'do 15.11', title: 'Kierownik odmówił podpisu protokołu', sub: 'JRG Kraśnik, zm. I · czekamy na powody (14 dni)', ago: '5 dni', href: 'zestawienie.html', isNew: true },
      { icon: 'group_add', when: 'szkic', title: 'st. kpt. Ewa Sowa dodała Cię do zespołu', sub: 'OSP Nałęczów · 12–20.11.2026 · szkic widzi tylko zespół', ago: '1 godz.', href: 'dokumenty.html', isNew: false },
      { icon: 'event_repeat', when: 'do 03.12', title: 'Ponowna inspekcja po ocenie niedostatecznej', sub: 'JRG Biała Podlaska, zm. III · ta sama zmiana', ago: '3 tyg.', href: 'zestawienie.html', isNew: false },
      { icon: 'calendar_month', when: 'do 15.12', title: 'Propozycja planu IGO na 2027 do KCKR', sub: 'Tabela nr 1 · minimum JRG KP/KM niespełnione', ago: '1 tydz.', href: 'plan.html', isNew: false }
    ];
    const items = all.map((n) => ({ ...n, whenStyle: n.urgent ? warn : 'color: #535f65;', iconStyle: n.urgent ? warn : '', bg: n.isNew ? 'background: #e1e6e9;' : '' }));
    const tabs = [['igo', 'Inspekcje'], ['all', 'Wszystkie']].map((t) => ({ label: t[1], on: this.state.tab === t[0], pick: () => this.setState({ tab: t[0] }) }));
    return { items, tabs, unread: all.filter((n) => n.isNew).length };
  }
}

(function () {
  const props = {};
  const applyTheme = () => document.body.classList.toggle('dark', props.theme === 'ciemny');
  const board = mountBoard(document.getElementById('board'), document.getElementById('board-template'), Component, props);
  applyTheme();
  document.querySelectorAll('.cbar select[data-prop]').forEach((select) => select.addEventListener('change', () => {
    props[select.dataset.prop] = select.value;
    board.setProps({ [select.dataset.prop]: select.value });
    applyTheme();
  }));
})();
</script>
</body>
</html>
