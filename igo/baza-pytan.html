<style>

.ghost{display:inline-flex;align-items:center;min-height:44px;padding:0 18px;border:1px solid #1c2427;color:#1c2427;font:inherit;font-size:14px;font-weight:500;background:none;cursor:pointer}
.h2{margin:0;font-size:18px;font-weight:600}
.fld{display:flex;flex-direction:column;gap:6px;font-size:12px;color:#535f65}
.fld input,.fld select{min-height:44px;border:1px solid #b4bec3;background:#ebeef0;padding:0 10px;font:inherit;font-size:14px;color:#1c2427;border-radius:0}
.seg{min-height:40px;padding:0 14px;border:1px solid #b4bec3;background:none;font:inherit;font-size:13px;color:#1c2427;cursor:pointer;margin:0 -1px -1px 0}
.seg[aria-pressed="true"]{background:#1c2427;border-color:#1c2427;color:#ebeef0}
.q{padding:16px 0;border-bottom:1px solid #d3dadd;display:flex;gap:16px}
.q .n{flex:none;width:52px;font-size:13px;color:#535f65;font-variant-numeric:tabular-nums}
.q p{margin:0}
.q ol{margin:8px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:14px}
.q li{display:flex;gap:8px}
.q li b{flex:none;width:16px;font-weight:500;color:#535f65}
.q li.ok{font-weight:600}
.q li.ok b{color:#1c2427;font-weight:600}
.q img{display:block;max-width:100%;max-height:200px;margin-top:10px;border:1px solid #d3dadd}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:1.3;cursor:pointer}
.chk input{margin:2px 0 0;accent-color:#1c2427}
.doc{font-family:'Roboto Condensed',Arial Narrow,sans-serif;font-size:11.5px;line-height:1.35;color:#000;background:#fff}
.doc p{margin:0}
.doc img{display:block;max-width:60%;max-height:120px;margin:4px 0}
</style>

<style>
html,body{margin:0;background:#ebeef0}
body.dark{background:#121518}
.cbar{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;padding:8px clamp(16px, 4vw, 40px);
  background:#1c2427;color:#ebeef0;font:500 13px/1.3 'Instrument Sans',ui-sans-serif,system-ui,sans-serif}
.cbar a{color:inherit;text-decoration:none;display:inline-flex;align-items:center;min-height:36px}
.cbar a:hover{text-decoration:underline}
.cbar .ttl{font-weight:700}
.cbar .tag{padding:3px 8px;border:1px solid #535f65;color:#a9b3b8;font-size:12px}
.cbar .sp{flex:1}
.cbar nav{display:flex;flex-wrap:wrap;gap:4px 16px}
.cbar nav a[aria-current="page"]{font-weight:700;text-decoration:underline}
.cbar label{display:inline-flex;align-items:center;gap:8px;color:#a9b3b8}
.cbar select{min-height:32px;padding:0 8px;border:1px solid #535f65;border-radius:0;background:#1c2427;color:#ebeef0;font:inherit}
.cbar a:focus-visible,.cbar select:focus-visible{outline:2px solid #ebeef0;outline-offset:2px}

body.framed #board{display:flex;justify-content:center;padding:32px 16px 64px;overflow-x:auto}
body.framed #board > *{flex:none;box-shadow:0 1px 2px rgba(28,36,39,.12),0 8px 32px rgba(28,36,39,.10)}

<body>
<div class="cbar">
<a href="../index.html">← Koncepcje Reports</a>
<span class="ttl">Inspekcje gotowości operacyjnej</span>

<div id="board"></div>
<template id="board-template">
<div style="font-family: 'Instrument Sans', system-ui, sans-serif; color: #1c2427; background: #ebeef0; min-height: 100%;">
<main style="max-width: 1360px; margin: 0 auto; padding: 48px clamp(16px, 4vw, 40px) 72px; box-sizing: border-box; display: flex; flex-direction: column; gap: 32px;">
<header>
<h1 style="margin: 6px 0 0; font-size: 34px; line-height: 1.15; font-weight: 600; letter-spacing: -0.01em;">Inspekcje gotowości operacyjnej</h1>
</header>
<nav aria-label="Widok modułu" style="display: flex; flex-wrap: wrap; border-bottom: 1px solid #d3dadd; margin-top: -8px;">

<div style="display: flex; flex-wrap: wrap; gap: 40px; align-items: flex-start;">
<section style="flex: 999 1 600px; min-width: 0; display: flex; flex-direction: column; gap: 20px;">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px;">
<div>
<h2 class="h2">Baza pytań KG PSP</h2>
<p style="margin: 6px 0 0; font-size: 14px; color: #535f65;">{{ source }}</p>
</div>
<div style="display: flex; gap: 12px; flex-wrap: wrap;"><button type="button" class="ghost">Dodaj pytanie własne</button><button type="button" class="btn">Importuj nową wersję</button></div>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 16px;">
<label class="fld" style="flex: 1 1 320px;">Dział<select onChange="{{ pickSection }}"><template data-sc="for" list="{{ sectionOptions }}" as="o"><option value="{{ o.value }}" selected="{{ o.on }}">{{ o.label }}</option></template></select></label>
<label class="fld" style="flex: 1 1 240px;">Szukaj<input type="search" placeholder="Treść pytania lub odpowiedzi" value="{{ query }}" onChange="{{ search }}"></label>
</div>
<p style="margin: 0; font-size: 14px;"><strong>{{ foundLabel }}</strong><span style="color: #535f65;"> · poprawne odpowiedzi pogrubione, jak w zestawie KG</span></p>
<div style="border-top: 1px solid #1c2427;">
<template data-sc="for" list="{{ rows }}" as="r" hint-placeholder-count="5">
<article class="q">
<span class="n">{{ r.n }}</span>
<div style="min-width: 0;">
<p class="eb" style="font-size: 11px;">{{ r.section }}</p>
<p style="margin-top: 4px; font-size: 15px; line-height: 1.4;">{{ r.q }}</p>
<template data-sc="for" list="{{ r.imgs }}" as="src"><img src="{{ src }}" alt="Ilustracja do pytania {{ r.n }}" loading="lazy"></template>
<ol><template data-sc="for" list="{{ r.answers }}" as="a"><li class="{{ a.cls }}"><b>{{ a.k }})</b><span>{{ a.t }}</span></li></template></ol>
</div>
</article>
</template>
<template data-sc="if" value="{{ empty }}" hint-placeholder-val="{{ false }}"><p style="margin: 0; padding: 24px 0; font-size: 14px; color: #535f65;">Brak pytań dla tego wyszukiwania.</p></template>
</div>
<template data-sc="if" value="{{ more }}" hint-placeholder-val="{{ true }}"><button type="button" class="ghost" style="align-self: flex-start;" onClick="{{ showMore }}">{{ moreLabel }}</button></template>
</section>

<section style="flex: 1 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 16px; border-top: 2px solid #1c2427; padding-top: 16px;">
<p class="eb">Generator · JRG 2 Puławy, zm. II</p>
<div style="display: flex; flex-wrap: wrap;"><template data-sc="for" list="{{ groups }}" as="g"><button type="button" class="seg" aria-pressed="{{ g.on }}" onClick="{{ g.pick }}">{{ g.label }}</button></template></div>
<fieldset style="margin: 0; padding: 0; border: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 16px;">
<legend class="eb" style="margin-bottom: 10px; font-size: 11px;">Działy w teście grupy</legend>
<template data-sc="for" list="{{ genSections }}" as="d"><label class="chk"><input type="checkbox" checked="{{ d.on }}" onChange="{{ d.toggle }}"><span>{{ d.label }}</span></label></template>
</fieldset>
<p style="margin: 0; font-size: 14px;">{{ genInfo }}</p>
<div style="display: flex; gap: 12px; flex-wrap: wrap;"><button type="button" class="btn" onClick="{{ reroll }}">Losuj nowy zestaw</button><button type="button" class="ghost" aria-pressed="{{ showKey }}" onClick="{{ toggleKey }}">{{ keyLabel }}</button><a class="ghost" href="test-telefon.html" style="text-decoration: none;">Test na urządzeniu</a></div>
<div class="doc" style="border: 1px solid #d3dadd; padding: 24px 28px; display: flex; flex-direction: column; gap: 9px;">
<div style="display: flex; justify-content: space-between; border-bottom: 1px solid #000; padding-bottom: 6px;"><strong style="font-size: 13px;">TEST WIEDZY · IGO JRG</strong><span>{{ setLabel }}</span></div>
<p>Stopień, imię i nazwisko: ………………………………… Data: 6 listopada 2026 r.</p>
<template data-sc="for" list="{{ testRows }}" as="t" hint-placeholder-count="15">
<div>
<p><strong>{{ t.i }}.</strong> {{ t.q }}</p>
<template data-sc="for" list="{{ t.imgs }}" as="src"><img src="{{ src }}" alt="Ilustracja do pytania {{ t.i }}"></template>
<p style="padding-left: 14px;"><template data-sc="for" list="{{ t.answers }}" as="a"><span style="{{ a.style }}">☐ {{ a.k }}) {{ a.t }}&nbsp;&nbsp; </span></template></p>
</div>
</template>
<template data-sc="if" value="{{ showKey }}" hint-placeholder-val="{{ false }}"><p style="border-top: 1px solid #000; padding-top: 6px;"><strong>Klucz:</strong> {{ keyLine }}</p></template>
<p style="border-top: 1px solid #000; padding-top: 6px;">Test rozwiązuje się samodzielnie, bez dokumentacji. Brak odpowiedzi lub więcej niż jedna odpowiedź = 0 pkt.</p>
</div>
</section>
</div>
</main>
</div>
</template>

    super(props);
    const sel = {};
    IGO_GROUPS.forEach((g) => { sel[g[0]] = g[3].slice(); });
    this.state = { section: 'all', query: '', limit: 30, group: 'rat', sel, seed: 7, showKey: false };
  }
  renderVals() {
    const s = this.state;
    const bank = window.IGO_PYTANIA || IGO_SAMPLE;
    const D = bank.dzialy;
    const norm = (t) => t.toLowerCase();
    const q = norm(s.query.trim());
    const all = bank.pytania;
    const found = all.filter((p) => (s.section === 'all' || D[p[1]][0] === s.section) && (!q || norm(p[2]).includes(q) || p[3].some((a) => norm(a).includes(q))));
    const answersOf = (p) => p[3].map((t, i) => ({ k: 'abcde'[i], t, cls: i === p[4] ? 'ok' : '' }));
    const imgsOf = (p) => (p[5] || []).map((f) => IGO_IMG + f);
    const rows = found.slice(0, s.limit).map((p) => ({ n: p[0] + '.', section: D[p[1]][0] + '. ' + D[p[1]][1], q: p[2], answers: answersOf(p), imgs: imgsOf(p) }));
    const sectionOptions = [{ value: 'all', label: 'Wszystkie działy (' + all.length + ')', on: s.section === 'all' }].concat(D.map((d, i) => ({ value: d[0], label: d[0] + '. ' + d[1] + ' (' + all.filter((p) => p[1] === i).length + ')', on: s.section === d[0] })));
    const pl = (n) => (n === 1 ? 'pytanie' : n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 12 || n % 100 > 14) ? 'pytania' : 'pytań');
    // Generator: 15 pytań losowanych z zaznaczonych działów (ziarno zmienia przycisk „Losuj”).
    const g = IGO_GROUPS.find((x) => x[0] === s.group);
    const chosen = s.sel[s.group];
    const pool = all.filter((p) => chosen.includes(D[p[1]][0]));
    const rnd = igoRandom(s.seed * 31 + IGO_GROUPS.indexOf(g));
    const deck = pool.slice();
    for (let i = deck.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); const t = deck[i]; deck[i] = deck[j]; deck[j] = t; }
    const test = deck.slice(0, 15);
    const testRows = test.map((p, i) => ({ i: i + 1, q: p[2], imgs: imgsOf(p), answers: p[3].map((t, k) => ({ k: 'abcde'[k], t, style: s.showKey && k === p[4] ? 'font-weight: 700;' : '' })) }));
    return {
      source: (window.IGO_PYTANIA ? bank.zrodlo : 'Próbka zestawu KG (po 2 pytania z działu); pełna baza jest na stronie koncepcji.') + ' · ' + all.length + ' ' + pl(all.length) + ' w ' + D.length + ' działach',
      sectionOptions, query: s.query, rows,
      pickSection: (e) => this.setState({ section: e.target.value, limit: 30 }),
      search: (e) => this.setState({ query: e.target.value, limit: 30 }),
      foundLabel: found.length + ' ' + pl(found.length), empty: found.length === 0,
      more: found.length > s.limit, moreLabel: 'Pokaż kolejne ' + Math.min(30, found.length - s.limit) + ' z ' + (found.length - s.limit),
      showMore: () => this.setState({ limit: s.limit + 30 }),
      groups: IGO_GROUPS.map((x) => ({ label: x[1], on: x[0] === s.group, pick: () => this.setState({ group: x[0] }) })),
      genSections: D.map((d) => ({ label: d[0] + '. ' + d[1], on: chosen.includes(d[0]), toggle: () => { const sel = Object.assign({}, s.sel); sel[s.group] = chosen.includes(d[0]) ? chosen.filter((x) => x !== d[0]) : chosen.concat([d[0]]); this.setState({ sel }); } })),
      genInfo: pool.length < 15 ? 'Za mało pytań w zaznaczonych działach (' + pool.length + '). Zaznacz więcej działów.' : '15 pytań losowanych z ' + pool.length + ' pytań zaznaczonych działów · osobny zestaw dla każdej grupy',
      reroll: () => this.setState({ seed: s.seed + 1 }),
      showKey: s.showKey, keyLabel: s.showKey ? 'Ukryj klucz' : 'Pokaż klucz',
      toggleKey: () => this.setState({ showKey: !s.showKey }),
      setLabel: 'Zestaw ' + g[2] + '-' + String(s.seed).padStart(2, '0') + ' · ' + g[1],
      testRows, keyLine: test.map((p, i) => (i + 1) + '-' + 'abcde'[p[4]]).join(', ')
    };
  }
}

(function () {
  const props = {};
  const applyTheme = () => document.body.classList.toggle('dark', props.theme === 'ciemny');
  const board = mountBoard(document.getElementById('board'), document.getElementById('board-template'), Component, props);
  applyTheme();
  document.querySelectorAll('.cbar select[data-prop]').forEach((select) => select.addEventListener('change', () => {
    props[select.dataset.prop] = select.value;
    board.setProps({ [select.dataset.prop]: select.value });
    applyTheme();
  }));
})();
</script>
