<script>

class Component extends DCLogic {
  constructor(props) { super(props); this.state = { kind: 'JRG', plan: { kwSk: [5, 5], kwJrg: [14, 14], kwOsp: [5, 5], kwCoo: [1, 1], kpSk: [14, 13], kpJrg: [42, 40], kpOsp: [160, 152] } }; }
  renderVals() {
    const ink = '#1c2427';
    const plan = [['Stanowiska kierowania', 9, 10], ['JRG PSP i szkoły', 21, 28], ['OSP w KSRG', 6, 10], ['Pododdziały COO', 2, 4]].map((r) => ({
      label: r[0], val: r[1] + ' / ' + r[2], bar: 'width: ' + Math.round((r[1] / r[2]) * 100) + '%; height: 10px; background: ' + ink + ';'
    }));
    const SHADES = ['#1c2427', '#3d484e', '#6b777d', '#a9b3b8', '#d3dadd', '#b3261e'];
    const NAMES = ['6 celujący', '5 bardzo dobry', '4 dobry', '3 dostateczny', '2 dopuszczający', '1 niedostateczny'];
    const grades = [['SK', [1, 4, 3, 1, 0, 0]], ['JRG', [2, 7, 7, 2, 1, 2]], ['OSP', [1, 0, 2, 1, 1, 1]]].map((g) => {
      const n = g[1].reduce((a, b) => a + b, 0);
      return { label: g[0], n, parts: g[1].map((c, i) => ({ style: 'flex: ' + c + ' 0 0; background: ' + SHADES[i] + ';' + (c ? '' : ' display: none;'), tip: NAMES[i] + ': ' + c })) };
    });
    const legend = NAMES.map((l, i) => ({ label: l, style: 'background: ' + SHADES[i] + ';' }));
    const H = [['≤70', 3], ['71–80', 5], ['81–90', 6], ['91–100', 3], ['101–115', 2], ['116–130', 1], ['131–145', 0], ['146–160', 0], ['161–175', 0], ['176–190', 0], ['191–300', 0], ['>300', 1]];
    const hist = H.map((h, i) => ({ label: h[0], n: h[1], bar: 'width: 100%; height: ' + (h[1] * 18) + 'px; background: ' + (i === 11 ? '#b3261e' : ink) + ';' }));
    const ISSUES = {
      SK: [['Rejestracja korespondencji radiowej', 3], ['Zasady i procedury KG PSP', 3], ['Ewakuacja SK w miejsce zastępcze', 2], ['Synchronizacja czasów w urządzeniach', 2], ['Informacja ze zdarzenia', 1], ['Ćwiczenie · współdziałanie ze służbami', 1]],
      JRG: [['Ćwiczenie · kontrola realizacji zadań', 11], ['Okresowa karta pracy sprzętu', 7], ['Ćwiczenie · wykonanie rozpoznania', 6], ['Alarmowanie · zapięcie pasów', 5], ['Kompletność i mocowanie sprzętu', 4], ['Gotowość · obsługa sprzętu', 3]],
      OSP: [['Wyposażenie · sygnalizatory bezruchu', 5], ['Wyposażenie · latarki ATEX', 4], ['Dane radiowe (aktualizacja)', 3], ['Instrukcja przyjęcia śmigłowca LPR', 3], ['Alarmowanie · zgłoszenie wyjazdu radiem', 2], ['Wyszkolenie · kurs KPP', 2]],
      COO: [['Samowystarczalność 36 h', 1], ['Wykaz danych radiowych', 1], ['Atlasy i nawigacja', 0], ['Karty alarmowania zastępu', 0], ['Dokumenty pojazdów i OC', 0], ['Rozwinięcie sił pododdziału', 0]]
    };
    const N = { SK: 9, JRG: 21, OSP: 6, COO: 2 };
    const list = ISSUES[this.state.kind];
    const max = Math.max(1, ...list.map((r) => r[1]));
    const issues = list.map((r) => ({ label: r[0], n: r[1], bar: 'width: ' + Math.round((r[1] / max) * 100) + '%; min-width: 2px; height: 10px; background: ' + ink + ';' }));
    const kinds = ['SK', 'JRG', 'OSP', 'COO'].map((k) => ({ label: k, on: this.state.kind === k, pick: () => this.setState({ kind: k }) }));
    const DEF = [
      ['Zarządzane przez KW PSP', [['kwSk', 'Stanowiska kierowania KW, KP, KM', '10 SK w województwie', 10, 'min. 10 · każde raz w roku'], ['kwJrg', 'JRG PSP i szkoły', '28 JRG w województwie', 28, 'min. 28 · każda raz w roku'], ['kwOsp', 'OSP w KSRG', '312 OSP w KSRG', null, 'według potrzeb'], ['kwCoo', 'Pododdziały COO', '4 pododdziały z województwa', 2, 'min. 2 · 50% w roku']]],
      ['Zarządzane przez KP/KM PSP', [['kpSk', 'Stanowiska kierowania KP, KM', '9 SK × 3 zmiany', 27, 'min. 27 · każda zmiana'], ['kpJrg', 'JRG PSP', '28 JRG × 3 zmiany', 84, 'min. 84 · każda zmiana'], ['kpOsp', 'OSP w KSRG', '312 OSP w KSRG', 312, 'min. 312 · każda raz w roku']]]
    ];
    let below = 0; let h1 = 0; let h2 = 0;
    const planGroups = DEF.map((g) => ({ title: g[0], cards: g[1].map((c) => {
      const v = this.state.plan[c[0]]; const total = v[0] + v[1]; const min = c[3];
      h1 += v[0]; h2 += v[1];
      const short = min !== null && total < min; if (short) below++;
      const scale = Math.max(total, min || 0, 1);
      const set = (i, d) => () => { const nv = v.slice(); nv[i] = Math.max(0, nv[i] + d); this.setState({ plan: { ...this.state.plan, [c[0]]: nv } }); };
      return {
        label: c[1], units: c[2], total, minText: c[4], icon: { kwSk: 'headset_mic', kpSk: 'headset_mic', kwJrg: 'fire_truck', kpJrg: 'fire_truck', kwOsp: 'local_fire_department', kpOsp: 'local_fire_department', kwCoo: 'airport_shuttle' }[c[0]],
        bar: 'width: ' + Math.round((total / scale) * 100) + '%; height: 10px; background: ' + (short ? '#b3261e' : ink) + ';',
        mark: min === null ? 'display: none;' : 'position: absolute; top: -4px; left: calc(' + Math.round((min / scale) * 100) + '% - 1px); width: 2px; height: 18px; background: ' + ink + ';',
        state: min === null ? 'bez minimum w załączniku 1' : short ? 'brakuje ' + (min - total) + ' do minimum' : '',
        stateStyle: short ? 'color: #b3261e; font-weight: 600;' : '',
        border: short ? 'border-top-color: #b3261e;' : '',
        halves: [{ label: 'I półrocze', v: v[0], inc: set(0, 1), dec: set(0, -1) }, { label: 'II półrocze', v: v[1], inc: set(1, 1), dec: set(1, -1) }]
      };
    }) }));
    const planWarn = below ? below + ' rodzaj poniżej minimum — „Przekaż” wymaga uzasadnienia' : 'Wszystkie minima spełnione';
    return { planGroups, planTotal: h1 + h2, planH1: h1, planH2: h2, planWarn, planWarnStyle: below ? 'color: #b3261e; font-weight: 600;' : '', plan, grades, legend, hist, issues, kinds, issuesNote: 'Liczba inspekcji z daną nieprawidłowością, z ' + N[this.state.kind] + ' przeprowadzonych.' };
  }
}

(function () {
  const props = {};
  const applyTheme = () => document.body.classList.toggle('dark', props.theme === 'ciemny');
  const board = mountBoard(document.getElementById('board'), document.getElementById('board-template'), Component, props);
  applyTheme();
  document.querySelectorAll('.cbar select[data-prop]').forEach((select) => select.addEventListener('change', () => {
    props[select.dataset.prop] = select.value;
    board.setProps({ [select.dataset.prop]: select.value });
    applyTheme();
  }));
})();
</script>
