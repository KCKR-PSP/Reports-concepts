<header style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px 32px;">

<div style="display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: center; justify-content: space-between;">
<label style="flex: 0 1 360px; display: flex;"><span style="position: absolute; left: -9999px;">Szukaj</span><input type="search" placeholder="Szukaj: jednostka, przewodniczący, nr upoważnienia" style="width: 100%; min-height: 40px; border: 0; border-bottom: 1px solid #1c2427; background: none; padding: 0 2px; font: inherit; font-size: 14px; color: #1c2427; border-radius: 0;"></label>
<div style="display: flex; gap: 16px; align-items: center; font-size: 13px; color: #535f65;"><template data-sc="if" value="{{ anyFilter }}" hint-placeholder-val="{{ false }}"><button type="button" class="lnk" onClick="{{ clearAll }}">Wyczyść filtry</button></template><button type="button" class="ghost">Eksport XLSX</button></div>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 32px 40px; align-items: flex-start;">
<div style="flex: 999 1 640px; min-width: 0; overflow-x: auto;">
<table class="tb" style="min-width: 820px;">
<thead><tr>
<template data-sc="for" list="{{ cols }}" as="c" hint-placeholder-count="6">
<th scope="col" aria-sort="{{ c.ariaSort }}" style="position: relative; {{ c.align }}">
<span style="display: inline-flex; align-items: center; gap: 4px;">
<button type="button" class="hbtn" onClick="{{ c.sort }}">{{ c.label }}<span style="width: 10px; display: inline-block; color: #1c2427;">{{ c.arrow }}</span></button>
<template data-sc="if" value="{{ c.hasFilter }}" hint-placeholder-val="{{ false }}"><button type="button" class="fbtn {{ c.fcls }}" aria-label="Filtr kolumny {{ c.label }}" aria-expanded="{{ c.open }}" onClick="{{ c.toggle }}"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M1 2h10L7 6.5V10L5 11V6.5Z" style="fill: {{ c.ffill }}; stroke: currentColor; stroke-width: 1.2px; stroke-linejoin: round;"></path></svg></button></template>
</span>
<template data-sc="if" value="{{ c.open }}" hint-placeholder-val="{{ false }}">
<div class="pop" role="group" aria-label="Filtr {{ c.label }}">
<template data-sc="for" list="{{ c.opts }}" as="o"><label class="opt"><input type="checkbox" checked="{{ o.on }}" onChange="{{ o.toggle }}"><span>{{ o.label }}</span><span style="margin-left: auto; color: #535f65;">{{ o.n }}</span></label></template>
<button type="button" class="lnk" onClick="{{ c.clear }}" style="margin-top: 6px;">Wszystkie</button>
</div>
</template>
</th>
</template>
</tr></thead>
<tbody>
<template data-sc="for" list="{{ rows }}" as="r" hint-placeholder-count="9">
<tr class="{{ r.cls }}">
<td>{{ r.date }}</td>
<td><button type="button" class="row-btn" onClick="{{ r.pick }}">{{ r.unit }}</button><div style="font-size: 12px; color: #535f65; margin-top: 2px;">{{ r.kind }}</div></td>
<td>{{ r.shift }}</td>
<td>{{ r.boss }}</td>
<td>{{ r.chair }}</td>
<td style="{{ r.gradeStyle }}">{{ r.grade }}</td>
</tr>
</template>
<template data-sc="if" value="{{ empty }}" hint-placeholder-val="{{ false }}"><tr><td colspan="6" style="padding: 28px 10px; color: #535f65;">Brak inspekcji dla wybranych filtrów. <button type="button" class="lnk" onClick="{{ clearAll }}" style="color: #1c2427; text-decoration: underline;">Wyczyść filtry</button></td></tr></template>
</tbody>
</table>
</div>

<aside aria-labelledby="det-title" style="flex: 1 1 380px; min-width: 0; border-top: 2px solid #1c2427; padding-top: 20px; display: flex; flex-direction: column; gap: 20px;">
<div>
<p class="eb">{{ cur.kind }} · {{ cur.date }}</p>
<h2 id="det-title" class="h2" style="margin-top: 6px; font-size: 22px;">{{ cur.unit }}, zm. {{ cur.shift }}</h2>
</div>
<div style="display: flex; gap: 32px; align-items: flex-end;">
<div><p class="eb">Punkty</p><p style="margin: 6px 0 0; font-size: 40px; line-height: 1; font-weight: 600; font-variant-numeric: tabular-nums;">{{ cur.pts }}</p></div>
<div><p class="eb">Ocena</p><p style="margin: 6px 0 0; font-size: 22px; font-weight: 600; {{ cur.gradeStyle }}">{{ cur.gradeLong }}</p></div>
</div>
<template data-sc="if" value="{{ hasParts }}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 8px;">
<p class="eb">Punkty w działach</p>
<template data-sc="for" list="{{ parts }}" as="p" hint-placeholder-count="6">
<div style="display: grid; grid-template-columns: minmax(0, 1fr) 90px 56px; gap: 10px; align-items: center; font-size: 13px;">
<span>{{ p.label }}</span>
<span style="height: 6px; background: #d3dadd; display: block;"><span style="{{ p.bar }}"></span></span>
<span style="text-align: right; font-variant-numeric: tabular-nums;"><strong>{{ p.val }}</strong><span style="color: #535f65;"> / {{ p.max }}</span></span>
</div>
</template>
</div>
</template>
<template data-sc="for" list="{{ flags }}" as="g" hint-placeholder-count="0"><p style="margin: 0; padding: 10px 12px; background: #b3261e; color: #ffffff; font-size: 13px; font-weight: 600;">{{ g }}</p></template>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 20px;">
<template data-sc="for" list="{{ facts }}" as="t" hint-placeholder-count="4"><div><p class="eb" style="font-size: 11px;">{{ t.k }}</p><p style="margin: 4px 0 0; font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums;">{{ t.v }}</p><p style="margin: 2px 0 0; font-size: 12px; color: #535f65;">{{ t.s }}</p></div></template>
</div>
<dl>
<dt>Upoważnienie</dt><dd>{{ cur.auth }}</dd>
<dt>Zespół</dt><dd>{{ cur.chair }} (przewodniczący), {{ cur.team }}</dd>
<dt>W obecności</dt><dd>{{ cur.present }}</dd>
<dt>Godziny</dt><dd>{{ cur.hours }}</dd>
<dt>Stan</dt><dd>{{ cur.state }}</dd>
<dt>Następny termin</dt><dd>{{ cur.next }}</dd>
</dl>
<div style="display: flex; flex-direction: column; gap: 10px;">
<div style="display: flex; justify-content: space-between; align-items: baseline;"><p class="eb">Dokumenty</p><a href="dokumenty.html" style="font-size: 13px;">Wszystkie ({{ docCount }})</a></div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;">
<template data-sc="for" list="{{ docs }}" as="d" hint-placeholder-count="4">
<a href="{{ d.link }}" class="doc" style="display: flex; gap: 12px; padding: 12px; background: #e1e6e9; text-decoration: none; color: #1c2427; min-height: 104px; box-sizing: border-box;">
<span aria-hidden="true" style="{{ d.paper }}">
<span style="display: block; height: 3px; background: #1c2427; margin-bottom: 5px;"></span>
<span style="display: block; height: 2px; background: #c8ced1; margin-bottom: 4px;"></span>
<span style="display: block; height: 2px; width: 80%; background: #c8ced1; margin-bottom: 4px;"></span>
<span style="display: block; height: 2px; background: #c8ced1; margin-bottom: 4px;"></span>
<span style="display: block; height: 2px; width: 60%; background: #c8ced1; margin-bottom: 4px;"></span>
<span style="display: block; height: 2px; background: #c8ced1;"></span>
<span style="{{ d.stamp }}"></span>
</span>
<span style="display: flex; flex-direction: column; gap: 4px; min-width: 0;">
<span style="font-size: 14px; font-weight: 600; line-height: 1.25;">{{ d.title }}</span>
<span style="font-size: 12px; color: #535f65;">{{ d.meta }}</span>
<span style="margin-top: auto; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; {{ d.stStyle }}">{{ d.st }}</span>
</span>
</a>
</template>
</div>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 12px;">
<a class="btn" href="kreator.html">Otwórz w kreatorze</a>
<button type="button" class="ghost">Wgraj skan</button>
</div>
</aside>
</div>
</main>
</div>
</template>
