<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>IGO — powiadomienia o terminach</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&amp;family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,200,0,0&amp;display=block">
<style>
body{margin:0}
.ms{font-family:"Material Symbols Outlined";font-weight:200;font-style:normal;font-size:24px;line-height:1;letter-spacing:normal;text-transform:none;white-space:nowrap;-webkit-font-smoothing:antialiased;font-feature-settings:"liga"}
.it{display:grid;grid-template-columns:28px minmax(0,1fr);gap:14px;padding:16px 4px;border-top:1px solid #d3dadd;text-decoration:none;color:#1c2427}
.it:hover{background:#e1e6e9}
.lnk{background:none;border:0;padding:6px 0;font:inherit;font-size:13px;color:#535f65;cursor:pointer;text-underline-offset:6px}
.lnk[aria-pressed="true"]{color:#1c2427;text-decoration:underline;text-decoration-thickness:2px}
</style>
</helmet>
<div style="width: 440px; height: 820px; box-sizing: border-box; padding: 24px 24px 20px; background: #ebeef0; color: #1c2427; font-family: 'Instrument Sans', system-ui, sans-serif; display: flex; flex-direction: column; gap: 14px; border: 1px solid #b4bec3;">
<div style="display: flex; justify-content: space-between; align-items: baseline;">
<h1 style="margin: 0; font-size: 22px; font-weight: 600;">Powiadomienia</h1>
<span style="font-size: 13px; color: #535f65;">{{ unread }} nowe</span>
</div>
<div role="group" aria-label="Filtr" style="display: flex; gap: 18px; border-bottom: 1px solid #d3dadd; margin-bottom: -15px;">
<sc-for list="{{ tabs }}" as="t"><button type="button" class="lnk" aria-pressed="{{ t.on }}" onClick="{{ t.pick }}">{{ t.label }}</button></sc-for>
</div>
<div style="display: flex; flex-direction: column;">
<sc-for list="{{ items }}" as="n" hint-placeholder-count="6">
<a class="it" href="{{ n.href }}" style="{{ n.bg }}">
<span class="ms" aria-hidden="true" style="{{ n.iconStyle }}">{{ n.icon }}</span>
<span style="display: flex; flex-direction: column; gap: 4px; min-width: 0;">
<span style="display: flex; justify-content: space-between; gap: 10px;"><span style="font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; {{ n.whenStyle }}">{{ n.when }}</span><span style="font-size: 12px; color: #535f65;">{{ n.ago }}</span></span>
<span style="font-size: 15px; font-weight: 600; line-height: 1.3;">{{ n.title }}</span>
<span style="font-size: 13px; color: #535f65;">{{ n.sub }}</span>
</span>
</a>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":440,"height":820}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { tab: 'igo' }; }
  renderVals() {
    const warn = 'color: #b3261e;';
    const all = [
      { icon: 'assignment_late', when: 'po terminie · 07.11', title: 'Protokół z IGO nie trafił do zarządzającego', sub: 'JRG 2 Puławy, zm. II · 4 dni robocze od 06.11', ago: '2 dni', href: 'Kreator.dc.html', urgent: true, isNew: true },
      { icon: 'send', when: 'dziś', title: 'Termin wystąpienia poinspekcyjnego', sub: 'OSP Końskowola · do wójta gminy · 14 dni od protokołu', ago: '08:00', href: 'Wystapienie.dc.html', urgent: true, isNew: true },
      { icon: 'block', when: 'do 15.11', title: 'Kierownik odmówił podpisu protokołu', sub: 'JRG Kraśnik, zm. I · czekamy na powody (14 dni)', ago: '5 dni', href: 'Zestawienie.dc.html', isNew: true },
      { icon: 'group_add', when: 'szkic', title: 'st. kpt. Ewa Sowa dodała Cię do zespołu', sub: 'OSP Nałęczów · 12–20.11.2026 · szkic widzi tylko zespół', ago: '1 godz.', href: 'Dokumenty.dc.html', isNew: false },
      { icon: 'event_repeat', when: 'do 03.12', title: 'Ponowna inspekcja po ocenie niedostatecznej', sub: 'JRG Biała Podlaska, zm. III · ta sama zmiana', ago: '3 tyg.', href: 'Zestawienie.dc.html', isNew: false },
      { icon: 'calendar_month', when: 'do 15.12', title: 'Propozycja planu IGO na 2027 do KCKR', sub: 'Tabela nr 1 · minimum JRG KP/KM niespełnione', ago: '1 tydz.', href: 'Plan.dc.html', isNew: false }
    ];
    const items = all.map((n) => ({ ...n, whenStyle: n.urgent ? warn : 'color: #535f65;', iconStyle: n.urgent ? warn : '', bg: n.isNew ? 'background: #e1e6e9;' : '' }));
    const tabs = [['igo', 'Inspekcje'], ['all', 'Wszystkie']].map((t) => ({ label: t[1], on: this.state.tab === t[0], pick: () => this.setState({ tab: t[0] }) }));
    return { items, tabs, unread: all.filter((n) => n.isNew).length };
  }
}
</script>
</body>
</html>
