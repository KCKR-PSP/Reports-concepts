<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Start · z jakiego poziomu patrzysz · Koncepcje Reports</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@300;400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
.st{min-height:100vh;box-sizing:border-box;color:#1c2427;font-family:'Instrument Sans',ui-sans-serif,system-ui,sans-serif;background:linear-gradient(160deg,hsl(200 11% 92%),hsl(202 10% 79%));padding:120px clamp(16px,6vw,96px);display:flex;flex-direction:column;gap:56px}
.opts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;max-width:1240px}
.opt{position:relative;aspect-ratio:5/4;background:#fff;padding:28px;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;transition:background .15s,color .15s}
.opt:hover{background:#1c2427;color:#fff}.opt:hover span{color:#fff!important}
.arr{position:absolute;top:24px;right:28px;font-size:22px}
@media (max-width:900px){.opts{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>

<style>
html,body{margin:0;background:#ebeef0}
body.dark{background:#121518}
.cbar{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;padding:8px clamp(16px, 4vw, 40px);
  background:#1c2427;color:#ebeef0;font:500 13px/1.3 'Instrument Sans',ui-sans-serif,system-ui,sans-serif}
.cbar a{color:inherit;text-decoration:none;display:inline-flex;align-items:center;min-height:36px}
.cbar a:hover{text-decoration:underline}
.cbar .ttl{font-weight:700}
.cbar .tag{padding:3px 8px;border:1px solid #535f65;color:#a9b3b8;font-size:12px}
.cbar .sp{flex:1}
.cbar nav{display:flex;flex-wrap:wrap;gap:4px 16px}
.cbar nav a[aria-current="page"]{font-weight:700;text-decoration:underline}
.cbar label{display:inline-flex;align-items:center;gap:8px;color:#a9b3b8}
.cbar select{min-height:32px;padding:0 8px;border:1px solid #535f65;border-radius:0;background:#1c2427;color:#ebeef0;font:inherit}
.cbar a:focus-visible,.cbar select:focus-visible{outline:2px solid #ebeef0;outline-offset:2px}
@media (max-width: 760px){.cbar{position:static}}
body.framed #board{display:flex;justify-content:center;padding:32px 16px 64px;overflow-x:auto}
body.framed #board > *{flex:none;box-shadow:0 1px 2px rgba(28,36,39,.12),0 8px 32px rgba(28,36,39,.10)}
</style>
</head>
<body>
<div class="cbar">
<a href="../index.html">← Koncepcje Reports</a>
<span class="ttl">Działania międzynarodowe</span>
<span class="tag">Koncepcja · dane przykładowe</span>
<nav aria-label="Plansze"></nav>
<span class="sp"></span>

</div>
<div id="board"></div>
<template id="board-template">
<div class="st">
<h1 style="margin:0;font-size:clamp(52px,7vw,104px);line-height:.95;font-weight:600;letter-spacing:-.035em">Działania międzynarodowe</h1>
<div style="display:flex;flex-direction:column;gap:20px"><p style="margin:0;font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#535f65">Z jakiego poziomu patrzysz</p><div class="opts"><a class="opt" href="zasob.html"><span style="font-size:28px;font-weight:600;letter-spacing:-.01em">KG PSP</span><span style="font-size:15px;color:#535f65">wszystkie jednostki</span><span class="arr">→</span></a><a class="opt" href="kw-pulpit.html"><span style="font-size:28px;font-weight:600;letter-spacing:-.01em">KW PSP Poznań</span><span style="font-size:15px;color:#535f65">województwo wielkopolskie</span><span class="arr">→</span></a><a class="opt" href="kp-pulpit.html"><span style="font-size:28px;font-weight:600;letter-spacing:-.01em">KP PSP Chodzież</span><span style="font-size:15px;color:#535f65">jednostka</span><span class="arr">→</span></a><a class="opt" href="os-powiadomienia.html"><span style="font-size:28px;font-weight:600;letter-spacing:-.01em">Członek modułu</span><span style="font-size:15px;color:#535f65">asp. Krzysztof Nowacki</span><span class="arr">→</span></a></div></div>
</div>
</template>
<script src="../assets/dc-runtime.js"></script>
<script>

class Component extends DCLogic { renderVals() { return {}; } }

(function () {
  const props = {};
  const applyTheme = () => document.body.classList.toggle('dark', props.theme === 'ciemny');
  const board = mountBoard(document.getElementById('board'), document.getElementById('board-template'), Component, props);
  applyTheme();
  document.querySelectorAll('.cbar select[data-prop]').forEach((select) => select.addEventListener('change', () => {
    props[select.dataset.prop] = select.value;
    board.setProps({ [select.dataset.prop]: select.value });
    applyTheme();
  }));
})();
</script>
</body>
</html>
