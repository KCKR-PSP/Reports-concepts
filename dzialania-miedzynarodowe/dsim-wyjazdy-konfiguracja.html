<style>

<div class="sch-cols"><sc-for list="{{cols}}" as="col" hint-placeholder-count="4"><div class="sch-col"><div class="sch-head">{{col.name}}<span>{{col.count}}</span></div><div class="sch-slots"><sc-for list="{{col.slots}}" as="s" hint-placeholder-count="4"><div class="sch-card">
<div class="sch-ttl"><span class="sch-nr">{{s.nr}}</span><span>{{s.fn}}</span></div>
<div class="{{s.cp}}" data-kind="p" data-fn="{{s.fn}}" onDragOver="{{allow}}" onDragEnter="{{enter}}" onDragLeave="{{leave}}" onDrop="{{s.dropp}}" onClick="{{s.clickp}}"><sc-if value="{{s.emptyp}}"><span class="ob-plus">+</span><span class="e1">wolne</span><span class="e2">upuść tutaj</span><span class="e3">pasuje · upuść</span></sc-if><sc-if value="{{s.hasp}}"><span class="sch-ini">{{s.ini}}</span><span class="sch-who"><b>{{s.pname}}</b><small>{{s.punit}}</small></span><span class="ob-x" onClick="{{s.clearp}}">×</span></sc-if></div>
<sc-if value="{{s.hasType}}"><div class="{{s.cv}}" data-kind="v" data-type="{{s.type}}" onDragOver="{{allow}}" onDragEnter="{{enter}}" onDragLeave="{{leave}}" onDrop="{{s.dropv}}" onClick="{{s.clickv}}"><sc-if value="{{s.emptyv}}"><span class="ob-plus">+</span><span class="e1">{{s.type}}</span><span class="e2">upuść tutaj</span><span class="e3">pasuje · upuść</span></sc-if><sc-if value="{{s.hasv}}"><span class="sch-veh">{{s.type}}</span><span>{{s.vname}}</span><span class="ob-x" onClick="{{s.clearv}}">×</span></sc-if></div></sc-if>
<sc-if value="{{s.warn}}"><div class="sch-warn">{{s.warnText}}</div></sc-if>
</div></sc-for></div></div></sc-for></div>
</div>
<section style="margin-top:12px"><div class="sch-head">Sprzęt dodatkowy<span>{{k.s}}</span></div><div class="{{xcls}}" data-kind="s" style="min-height:100px;flex-wrap:wrap;align-items:flex-start;align-content:flex-start;gap:10px;padding:14px;margin-top:16px" onDragOver="{{allow}}" onDragEnter="{{enter}}" onDragLeave="{{leave}}" onDrop="{{dropx}}" onClick="{{clickx}}"><sc-for list="{{extra}}" as="x" hint-placeholder-count="3"><span class="ob-chip">{{x.name}}<small>{{x.mass}}</small><span class="ob-x" style="margin-left:6px" onClick="{{x.clear}}">×</span></span></sc-for><span class="ob-plus">+</span><span class="e1">przeciągnij sprzęt z listy</span><span class="e2">upuść tutaj</span><span class="e3">upuść tutaj</span></div></section>
</div>
<aside style="display:flex;flex-direction:column;gap:22px;background:rgb(255 255 255/.6);padding:24px 22px 28px">
<div style="display:flex;border-bottom:1px solid #d3dadd"><sc-for list="{{ctabs}}" as="t" hint-placeholder-count="2"><span class="{{t.cls}}" onClick="{{t.pick}}" style="cursor:pointer">{{t.label}}</span></sc-for></div>
<span class="inp" style="height:34px">Szukaj osoby lub pojazdu</span>
<span style="font-size:13px;color:#535f65">{{hint}}</span>
<sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
<div style="display:flex;flex-direction:column;gap:10px"><span class="lbl">{{g.unit}}</span>
<sc-for list="{{g.items}}" as="p" hint-placeholder-count="3"><div class="{{p.cls}}" draggable="true" onDragStart="{{p.start}}" onDragEnd="{{p.end}}" onClick="{{p.pick}}" style="flex-direction:row;align-items:center;gap:10px"><span class="ob-cand-ini">{{p.ini}}</span><span style="display:flex;flex-direction:column;gap:1px;min-width:0"><b style="font-weight:600">{{p.name}}</b><span style="color:#535f65">{{p.sub}}</span></span></div></sc-for>
</div>
</sc-for>
</aside>
</div>
<div style="display:flex;align-items:center;gap:12px;padding-top:28px;border-top:1px solid rgb(28 36 39/.12)"><a class="pillb" href="dsim-wyjazd-krok1.html">← Wstecz</a><span style="flex:1"></span><span class="pillb">Zapisz szkic</span><a class="pillp" href="dsim-wyjazd-krok3.html">Dalej: kontrola →</a></div>
</div></div></div>
</template>
<script src="../assets/dc-runtime.js"></script>
<script>

const SECTIONS = [
 ['Zespół dowodzenia', [[1,'Dowódca grupy','SLOp'],[2,'Zastępca dowódcy grupy',''],[3,'Oficer łącznikowy','SLOp'],[4,'Info/media manager',''],[5,'Operator SDŁ, kierowca','SDŁ']]],
 ['Zespół logistyczny', [[10,'Dowódca zespołu logistycznego','SLKw'],[11,'Kierowca ratownik','SCKn'],[12,'Kierowca ratownik','SCKw']]],
 ['Pluton A', [[31,'Dowódca plutonu','GCBA'],[32,'Ratownik kierowca',''],[33,'Ratownik',''],[34,'Ratownik','']]],
 ['Pluton B', [[61,'Ratownik kierowca','GCBA'],[62,'Dowódca zastępu',''],[63,'Dowódca plutonu, kierowca','GCBA'],[64,'Ratownik','']]]
];
const PEOPLE = [
 ['p1','bryg. Tomasz Wierzbicki','KW PSP Poznań','Dowódca grupy',true],['p2','st. kpt. Anna Lisowska','KW PSP Poznań','Zastępca dowódcy grupy',true],
 ['p3','kpt. Paweł Grochowski','KM PSP Poznań','Oficer łącznikowy',true],['p4','mł. kpt. Karolina Mazurek','KM PSP Poznań','Info/media manager',false],
 ['p10','mł. kpt. Ewa Chmielewska','KM PSP Poznań','Dowódca zespołu logistycznego',true],['p5','asp. Michał Sobczyk','KM PSP Poznań','Operator SDŁ, kierowca',true],
 ['p6','asp. Krzysztof Nowacki','KP PSP Chodzież','Operator SDŁ, kierowca',true],['p7','st. ogn. Łukasz Pawlak','KP PSP Chodzież','Kierowca ratownik',true],
 ['p8','ogn. Adam Kurek','KP PSP Chodzież','Ratownik',false],['p9','mł. ogn. Bartosz Sikorski','KP PSP Chodzież','Ratownik kierowca',true],
 ['p11','st. sekc. Rafał Duda','KP PSP Czarnków','Kierowca ratownik',true],['p12','asp. Piotr Wróblewski','KM PSP Piła','Dowódca plutonu',true],
 ['p13','mł. asp. Jakub Malinowski','KM PSP Piła','Ratownik kierowca',true],['p14','st. str. Damian Kaczmarczyk','KM PSP Leszno','Ratownik',false],
 ['p15','kpt. Grzegorz Szulc','KM PSP Konin','Dowódca plutonu',true]
];
const VEH = [['v1','SLOp · 301[P]21','KW PSP Poznań','SLOp'],['v2','SLOp · 301[P]44','KM PSP Poznań','SLOp'],['v3','SDŁ · 381[P]12','KP PSP Chodzież','SDŁ'],['v4','SLKw · 301[P]63','KM PSP Poznań','SLKw'],['v5','SCKn · 371[P]18','KP PSP Czarnków','SCKn'],['v6','SCKw · 391[P]27','KP PSP Chodzież','SCKw'],['v7','GCBA · 301[P]71','KM PSP Piła','GCBA'],['v8','GCBA · 351[P]35','KM PSP Konin','GCBA'],['v9','GCBA · 361[P]52','KM PSP Leszno','GCBA']];
const EQ = [['s1','Skrzynia medyczna M-07','48 kg'],['s2','Agregat prądotwórczy 2,2 kW','21 kg'],['s3','Radiotelefon przewoźny','5 kg'],['s4','Zbiornik składany 10 000 l','85 kg'],['s5','Pompa pływająca','30 kg'],['s6','Maszt oświetleniowy','42 kg'],['s7','Pilarka spalinowa','7 kg']];
const byId = {};
EQ.forEach(e => { byId[e[0]] = {name: e[1], unit: e[2], mass: e[2]}; });
PEOPLE.forEach(p => { byId[p[0]] = {name: p[1], unit: p[2], fn: p[3], decl: p[4]}; });
VEH.forEach(v => { byId[v[0]] = {name: v[1], unit: v[2], type: v[3]}; });
const kindOf = (id) => id.startsWith('v') ? 'v' : id.startsWith('s') ? 's' : 'p';
const fits = (id, z) => kindOf(id) === 'v' ? byId[id].type === z.type : kindOf(id) === 's' ? false : byId[id].fn === z.fn;
function mark(root, id) {
 if (!root) return;
 root.classList.add('dragging');
 root.querySelectorAll('.ob-drop').forEach((z) => {
  const ok = z.dataset.kind === kindOf(id);
  z.classList.toggle('target', ok);
  z.classList.toggle('blocked', !ok);
  z.classList.toggle('match', ok && fits(id, z.dataset));
 });
}
function unmark(root) {
 if (!root) return;
 root.classList.remove('dragging');
 root.querySelectorAll('.ob-drop').forEach((z) => z.classList.remove('target', 'blocked', 'match', 'over'));
 root.querySelectorAll('.ob-cand.lifted').forEach((c) => c.classList.remove('lifted'));
}
const ini = (name) => name.replace(/^[^ ]+\.? /, '').replace(/\[|\]/g, '').split(' ').filter(Boolean).map(w => w[0]).join('').slice(-2).toUpperCase();
class Component extends DCLogic {
 constructor(props) {
  super(props);
  this.drag = null;
  this.state = {tab: 'p', shift: '1', picked: null, extra: ['s1','s2','s3'], a: {'1:1':'p1','1:2':'p2','2:1':'p2','3:1':'p3','5:1':'p6','5:2':'p5','10:1':'p10','11:1':'p11','12:1':'p7','31:1':'p12','32:1':'p13','33:1':'p8','61:1':'p9','1:v':'v1','3:v':'v2','5:v':'v3','10:v':'v4','11:v':'v5','12:v':'v6','31:v':'v7'}};
 }
 put(key, id) {
  if (!id) return;
  if (kindOf(id) === 's') { if (key === 'x' && !this.state.extra.includes(id)) this.setState({extra: this.state.extra.concat([id]), picked: null}); return; }
  if ((kindOf(id) === 'v') !== key.endsWith(':v')) return;
  const a = Object.assign({}, this.state.a);
  const shift = key.split(':')[1];
  Object.keys(a).forEach(k => { if (a[k] === id && k.split(':')[1] === shift) delete a[k]; });
  a[key] = id;
  this.setState({a, picked: null});
 }
 clear(key, e) { if (e && e.stopPropagation) e.stopPropagation(); const a = Object.assign({}, this.state.a); delete a[key]; this.setState({a}); }
 renderVals() {
  const s = this.state, a = s.a, picked = s.picked, sh = s.shift;
  const zoneCls = (o, kind, z, warn) => {
   let c = 'ob-drop' + (o ? ' full' : '') + (warn ? ' warn' : '');
   if (picked) { const ok = kindOf(picked) === kind; c += ok ? ' target' + (fits(picked, z) ? ' match' : '') : ' blocked'; }
   return c;
  };
  const handlers = (key) => ({
   drop: (e) => { if (e && e.preventDefault) e.preventDefault(); const id = this.drag; this.drag = null; unmark(e && e.currentTarget && e.currentTarget.closest('.ob-grid')); this.put(key, id); },
   click: () => { if (picked) this.put(key, picked); },
   clear: (e) => this.clear(key, e)
  });
  const slot = ([nr, fn, type]) => {
   const z = {fn, type: type || '—'};
   const pk = nr + ':' + sh, vk = nr + ':v';
   const po = a[pk] ? byId[a[pk]] : null, vo = a[vk] ? byId[a[vk]] : null;
   const warn = !!(po && po.fn !== fn);
   const hp = handlers(pk), hv = handlers(vk);
   return {nr: String(nr), fn, type: type || '', hasType: !!type,
    cp: zoneCls(po, 'p', z, warn), emptyp: !po, hasp: !!po, ini: po ? ini(po.name) : '', pname: po ? po.name.replace(/^[^ ]+ [^ ]+\. |^[^ ]+\. /, '') : '', punit: po ? po.unit : '', dropp: hp.drop, clickp: hp.click, clearp: hp.clear,
    cv: zoneCls(vo, 'v', z, false), emptyv: !vo, hasv: !!vo, vname: vo ? vo.name.split(' · ')[1] + ' · ' + vo.unit : '', dropv: hv.drop, clickv: hv.click, clearv: hv.clear,
    warn, warnText: warn ? 'Inna funkcja osoby: ' + po.fn : ''};
  };
  const all = SECTIONS.reduce((x, sec) => x.concat(sec[1]), []);
  const filled = (shift) => all.filter((x) => a[x[0] + ':' + shift]).length;
  const typed = all.filter(x => x[2]);
  const cols = SECTIONS.map(([name, slots], i) => {
   const list = i === 0 ? slots.filter(x => x[0] !== 1) : slots;
   return {name, count: slots.filter((x) => a[x[0] + ':' + sh]).length + ' z ' + slots.length, slots: list.map(slot)};
  });
  const usedHere = new Set(Object.keys(a).filter(k => k.endsWith(':' + sh) || k.endsWith(':v')).map(k => a[k]));
  const pick = (id) => () => this.setState({picked: picked === id ? null : id});
  const start = (id) => (e) => {
   this.drag = id;
   if (e && e.dataTransfer) { e.dataTransfer.setData('text/plain', id); e.dataTransfer.effectAllowed = 'move'; }
   const el = e && e.currentTarget;
   if (el) { el.classList.add('lifted'); mark(el.closest('.ob-grid'), id); }
  };
  const end = (e) => { this.drag = null; unmark(e && e.currentTarget && e.currentTarget.closest('.ob-grid')); };
  const list = s.tab === 's' ? EQ.map(e => ({id: e[0], name: e[1], unit: 'Sprzęt DSIM', sub: e[2], ini: '+'})) : s.tab === 'p' ? PEOPLE.map(p => ({id: p[0], name: p[1], unit: p[2], sub: p[3] + (p[4] ? ' · będzie' : ' · brak deklaracji'), ini: ini(p[1])}))
                             : VEH.map(x => ({id: x[0], name: x[1], unit: x[2], sub: x[2], ini: x[3]}));
  const units = [];
  list.forEach(x => { let g = units.find(u => u.unit === x.unit); if (!g) { g = {unit: x.unit, items: []}; units.push(g); } g.items.push({name: x.name, sub: x.sub, ini: x.ini, cls: 'ob-cand' + (usedHere.has(x.id) ? ' used' : '') + (picked === x.id ? ' picked' : ''), start: start(x.id), end, pick: pick(x.id)}); });
  return {
   k: {p: filled('1') + ' z ' + all.length, s: s.extra.length + ' poz. · ' + s.extra.reduce((t, id) => t + parseInt(byId[id].mass, 10), 0) + ' kg'},
   rootCls: 'ob-grid' + (picked ? ' dragging' : ''),
   shifts: [['1', 'Zmiana I'], ['2', 'Zmiana II']].map(([k, l]) => ({label: l, count: filled(k) + ' z ' + all.length, cls: 'cz-tab' + (sh === k ? ' on' : ''), pick: () => this.setState({shift: k, picked: null})})),
   extra: s.extra.map(id => ({name: byId[id].name, mass: byId[id].mass, clear: (e) => { if (e && e.stopPropagation) e.stopPropagation(); this.setState({extra: s.extra.filter(x => x !== id)}); }})),
   xcls: 'ob-drop' + (s.extra.length ? ' full' : '') + (picked ? (kindOf(picked) === 's' ? ' target' : ' blocked') : ''),
   dropx: (e) => { if (e && e.preventDefault) e.preventDefault(); const id = this.drag; this.drag = null; unmark(e && e.currentTarget && e.currentTarget.closest('.ob-grid')); this.put('x', id); },
   clickx: () => { if (picked) this.put('x', picked); },
   veh: typed.filter((x) => a[x[0] + ':v']).length + ' z ' + typed.length,
   top: [slot(SECTIONS[0][1][0])],
   cols,
   allow: (e) => { if (e && e.preventDefault) e.preventDefault(); if (e && e.dataTransfer) e.dataTransfer.dropEffect = 'move'; },
   enter: (e) => { const z = e && e.currentTarget; if (z && z.classList.contains('target')) z.classList.add('over'); },
   leave: (e) => { const z = e && e.currentTarget; if (z && (!e.relatedTarget || !z.contains(e.relatedTarget))) z.classList.remove('over'); },
   ctabs: [['p', 'Osoby'], ['v', 'Pojazdy'], ['s', 'Sprzęt']].map(([k, l]) => ({label: l, cls: 'cz-tab' + (s.tab === k ? ' on' : ''), pick: () => this.setState({tab: k, picked: null})})),
   hint: picked ? 'Wybrano: ' + byId[picked].name + '. Kliknij wyróżnione miejsce na schemacie.' : (s.tab === 's' ? 'Przeciągnij sprzęt do pola Sprzęt dodatkowy pod schematem.' : s.tab === 'p' ? 'Przeciągnij osobę na stanowisko. Stanowiska z tą samą funkcją się wyróżnią.' : 'Przeciągnij pojazd na stanowisko z tym samym typem.'),
   groups: units
  };
 }
}


(function () {
  const props = {};
  const applyTheme = () => document.body.classList.toggle('dark', props.theme === 'ciemny');
  const board = mountBoard(document.getElementById('board'), document.getElementById('board-template'), Component, props);
  applyTheme();
  document.querySelectorAll('.cbar select[data-prop]').forEach((select) => select.addEventListener('change', () => {
    props[select.dataset.prop] = select.value;
    board.setProps({ [select.dataset.prop]: select.value });
    applyTheme();
  }));
})();
</script>
